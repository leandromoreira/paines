<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>paines (plain HTTP)</title>
<style>
  body { background: #111; color: #ccc; font: 14px monospace; text-align: center; margin: 1em; }
  canvas { width: 768px; height: 720px; image-rendering: pixelated; background: #000; }
  #stats { margin-top: .5em; white-space: pre; }
</style>
</head>
<body>
<canvas id="screen" width="256" height="240"></canvas>
<div id="stats">connecting...</div>
<div>arrows, Z = B, X = A, Enter = Start, Tab/Shift = Select &nbsp;|&nbsp; ?fps=30 caps the request rate, ?z=0 turns gzip off</div>
<script>
const params = new URLSearchParams(location.search);
const targetFps = Number(params.get("fps") || 0);        // 0 = as fast as frames arrive
const gzipFlag = params.get("z") === "0" ? "0" : "1";
const W = 256, H = 240;
const ctx = document.getElementById("screen").getContext("2d");
const image = ctx.createImageData(W, H);
const pixels = new Uint32Array(image.data.buffer);
const palette = new Uint32Array(64);

// ---- input: one POST in flight at a time, always carrying the latest mask ----
const KEYS = { x: 0x01, z: 0x02, Shift: 0x04, Tab: 0x04, Enter: 0x08,
               ArrowUp: 0x10, ArrowDown: 0x20, ArrowLeft: 0x40, ArrowRight: 0x80 };
let mask = 0, sentMask = 0, sending = false, inputRtt = 0;
async function flushInput() {
  if (sending) return;
  sending = true;
  while (sentMask !== mask) {
    const value = mask, t = performance.now();
    await fetch("/input", { method: "POST", body: String(value), keepalive: true });
    inputRtt = performance.now() - t;
    sentMask = value;
  }
  sending = false;
}
function setKey(event, down) {
  const bit = KEYS[event.key];
  if (!bit) return;
  event.preventDefault();
  mask = down ? mask | bit : mask & ~bit;
  flushInput();
}
addEventListener("keydown", e => { if (!e.repeat) setKey(e, true); });
addEventListener("keyup", e => setKey(e, false));

// ---- frames: long poll for anything newer than the last one we drew ----
let seq = 0, drawn = 0, bytes = 0, fetchMs = 0, lastReport = performance.now();
async function loop() {
  const rgb = new Uint8Array(await (await fetch("/palette")).arrayBuffer());
  for (let i = 0; i < 64; i++) {
    palette[i] = 0xff000000 | rgb[i * 3 + 2] << 16 | rgb[i * 3 + 1] << 8 | rgb[i * 3];
  }
  let next = performance.now();
  for (;;) {
    const t = performance.now();
    let response;
    try {
      response = await fetch(`/frame?after=${seq}&z=${gzipFlag}`);
    } catch (error) {
      await new Promise(r => setTimeout(r, 500));
      continue;
    }
    if (response.status === 204) continue;
    const frame = new Uint8Array(await response.arrayBuffer());
    fetchMs += performance.now() - t;
    // Content-Length is the compressed size on the wire, even though fetch hands us the decoded body.
    bytes += Number(response.headers.get("Content-Length") || frame.length);
    seq = Number(response.headers.get("X-Frame-Seq"));
    for (let i = 0; i < pixels.length; i++) pixels[i] = palette[frame[i] & 63];
    ctx.putImageData(image, 0, 0);
    drawn++;

    const now = performance.now();
    if (now - lastReport >= 1000) {
      const seconds = (now - lastReport) / 1000;
      document.getElementById("stats").textContent =
        `${(drawn / seconds).toFixed(1)} fps   ${(bytes / drawn / 1024).toFixed(1)} KB/frame   ` +
        `${(fetchMs / drawn).toFixed(1)} ms/frame fetch   input POST ${inputRtt.toFixed(1)} ms   server frame #${seq}`;
      drawn = bytes = fetchMs = 0;
      lastReport = now;
    }
    if (targetFps) {
      next += 1000 / targetFps;
      const wait = next - performance.now();
      if (wait > 0) await new Promise(r => setTimeout(r, wait)); else next = performance.now();
    }
  }
}
loop();
</script>
</body>
</html>
